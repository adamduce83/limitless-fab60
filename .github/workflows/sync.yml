name: Fab 60 Sync

on:
  schedule:
    - cron: '0 2 * * 2'   # Tuesday 12:00 PM AEST (UTC+10)
    - cron: '0 5 * * 5'   # Friday 3:00 PM AEST (UTC+10)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fab 60 sync
        env:
          SIMPRO_API_TOKEN: ${{ secrets.SIMPRO_API_TOKEN }}
        run: node sync.js

      - name: Commit updated data
        run: |
          git config user.name "fab60-sync[bot]"
          git config user.email "fab60-sync[bot]@users.noreply.github.com"
          git add fab60-data.json
          git diff --cached --quiet || git commit -m "Fab 60 data sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
